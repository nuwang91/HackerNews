<div class="card-container">
    <div class="title">{{title()}}</div>
    <div class="body" [innerHTML]="sanitizedBody()"></div>
    <div class="meta">
        <span class="clock"></span>
        <span class="time">{{time()}}</span>
        <span class="line"></span>
        <span class="comment">{{comment()}}</span>
    </div>
</div>
