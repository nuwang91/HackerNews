<div class="news-container">
  @for (item of newsItems; track item.id) {
    <div class="news-card-wrapper">
      <a [href]="item.url">
        <app-card
          [title]="item.title"
          [body]="getBodyText(item.text)"
          [time]="getTime(item.time)"
          [comment]="getComments(item.descendants)"
        ></app-card>
      </a>
    </div>
  }
</div>
